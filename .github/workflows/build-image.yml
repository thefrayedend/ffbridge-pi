# FlashForge Bridge - builds the ready-to-flash SD card image.
#
# How to use: put the Orange Pi Zero 4 image you downloaded into a GitHub release called
# "base-image", then go to Actions -> "Build SD card image" -> Run workflow.
# The finished image appears under Releases -> "Latest SD card image".
name: Build SD card image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the Orange Pi image from the "base-image" release
        run: |
          mkdir -p base
          gh release download base-image --dir base --repo "$GITHUB_REPOSITORY" || {
            echo "::error::No release called 'base-image' found. Create a release with the tag base-image and attach the Orange Pi Zero 4 image file to it."; exit 1; }
          ls -lh base
          BASE_FILE="$(ls -S base/* | head -1)"
          echo "BASE_FILE=$BASE_FILE" >> "$GITHUB_ENV"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Compile the bridge
        working-directory: pi-bridge/bridge
        run: |
          dart pub get
          dart run test/prediction_check.dart
          dart run test/mapping_check.dart
          dart compile exe bin/pibridge.dart -o "$GITHUB_WORKSPACE/pibridge"

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fdisk dosfstools mtools e2fsprogs xz-utils rsync python3 curl p7zip-full util-linux

      - name: Download the AI model
        run: bash pi-bridge/ai/fetch-model.sh pi-bridge/ai/model/model-weights.onnx

      - name: Build the SD card image
        run: |
          sudo bash pi-bridge/image/build-image.sh \
            --base "$BASE_FILE" \
            --bridge-bin "$GITHUB_WORKSPACE/pibridge" \
            --model pi-bridge/ai/model/model-weights.onnx \
            --name ffbridge-orangepi-zero4 \
            --out "$GITHUB_WORKSPACE/out"
          ls -lh out

      - name: Publish it as the "Latest SD card image" release
        run: |
          gh release delete latest-image --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-image out/* --repo "$GITHUB_REPOSITORY" \
            --title "Latest SD card image" --notes-file pi-bridge/RELEASE-NOTES.md
